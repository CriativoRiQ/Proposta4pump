{slug:'objetivo',label:'Uma direção clara',html:heading('01 / OBJETIVO','Seu diferencial merece<br>ser <em>visto.</em>','Uma campanha integrada para valorizar a estrutura, evidenciar o acompanhamento profissional e aproximar a academia de futuros alunos.')+`<div class="cards">${feature('↗','Despertar interesse','Comunicar a experiência da academia com conteúdo consistente e uma presença digital organizada.')}${feature('◎','Construir confiança','Apresentar a equipe, o cuidado no atendimento e a rotina de quem treina com orientação.')}${feature('→','Incentivar o próximo passo','Facilitar o contato, o agendamento de aulas experimentais e o convite para matrícula.')}</div><div class="strip"><p>Uma jornada conectada: <strong>descoberta → interesse → experiência → matrícula.</strong></p><span class="tag">FOCO EM CAPTAÇÃO</span></div>`},
{slug:'conceito',label:'Conceito da campanha',html:heading('02 / POSICIONAMENTO','A força está em<br><em>quem acompanha.</em>')+`<blockquote class="quote">Aqui você<br>não treina <span>sozinho.</span></blockquote><p class="lead">Profissionais do seu lado em cada exercício, do primeiro dia até a sua evolução.</p><div class="cards four">${feature('01','Atendimento próximo','Pessoas cuidando de pessoas.')}${feature('02','Treino orientado','Acompanhamento para cada fase.')}${feature('03','Estrutura e equipe','O ambiente e quem faz a diferença.')}${feature('04','Qualidade de vida','Mais disposição, força e evolução.')}</div>`},
{slug:'canais',label:'Presença digital',html:heading('03 / CANAIS','Uma presença.<br><em>Vários pontos de contato.</em>','Instagram, Facebook, Google Meu Negócio e site conectados à mesma estratégia de comunicação.')+`<div class="cards">${card('02','Perfis administrados','Instagram e Facebook: organização, programação e publicação durante os 90 dias.')}${card('13','Publicações no Google','Conteúdos ao longo da campanha, com atualização de informações e fotos no Perfil da Empresa.')}${card('01','Site institucional','Uma apresentação própria da academia, com informações e acesso ao WhatsApp.')}</div><p class="fine">Os conteúdos de Instagram e Facebook integram o mesmo calendário. A distribuição entre os canais respeitará os formatos de cada plataforma.</p>`},
{slug:'conteudo',label:'Conteúdo em movimento',html:heading('04 / PRODUÇÃO','O cuidado aparece<br><em>em cada conteúdo.</em>','Um acervo de comunicação para apresentar o que faz a Health ser diferente, com registros da própria academia.')+`<div class="cards">${card('39','Vídeos produzidos','Planejamento, roteiro, captação, edição e legendas. Distribuição de três vídeos por semana de conteúdo.')}${card('26','Criativos estáticos','Duas peças por semana de conteúdo, alinhadas à identidade e às mensagens da campanha.')}${card('90','Fotos tratadas','Estrutura, equipamentos, profissionais, aulas e rotina, captados nas visitas programadas.')}</div><div class="strip"><p><strong>65 publicações principais</strong> em aproximadamente 13 semanas de conteúdo.</p><span class="tag">VOLUMES TOTAIS DA CAMPANHA</span></div><p class="fine">Calendário distribuído dentro dos 90 dias. Pessoas fotografadas ou filmadas deverão ter autorização de uso de imagem.</p>`},
{slug:'presencial',label:'Presença na academia',html:heading('05 / ACOMPANHAMENTO','Perto da rotina.<br><em>Perto da sua marca.</em>','Uma social media presente para captar conteúdo, reconhecer oportunidades e acompanhar as ações de comunicação.')+`<div class="cards">${card('26','Visitas presenciais','Duas visitas por semana, conforme calendário acordado para os 90 dias.')}${card('14h–17h','Horário das visitas','Três horas por encontro para registros fotográficos, gravações e acompanhamento.')}${card('78h','Presença total','Horas presenciais previstas ao longo de toda a campanha.')}</div><div class="strip"><p>O trabalho segue além das visitas: <strong>planejamento, criação, edição e publicação.</strong></p></div>`},
{slug:'planejamento',label:'Planejamento e roteiros',html:heading('06 / ESTRATÉGIA EDITORIAL','Cada publicação<br>com uma <em>intenção.</em>','Temas, formatos e chamadas organizados para sustentar a campanha, valorizar a equipe e incentivar o primeiro contato.')+`<div class="cards four">${card('01','Plano estratégico','Objetivos, posicionamento, público e direção de comunicação.')}${card('03','Calendários editoriais','Organização dos conteúdos dos três meses de campanha.')}${card('39','Roteiros de vídeo','Direção das mensagens e da captação audiovisual.')}${card('65','Legendas','Textos para vídeos e criativos estáticos.')}</div><div class="strip"><p>Inclui textos persuasivos para os anúncios previstos na campanha.</p><span class="tag">COERÊNCIA DO INÍCIO AO FIM</span></div>`},
{slug:'identidade',label:'Identidade visual',html:`<div class="split"><div>${heading('07 / IDENTIDADE VISUAL','Uma campanha com<br><em>presença própria.</em>','Criação de uma identidade visual para os 90 dias, alinhada à marca da academia.')}<ul class="list"><li>Conceito e linguagem visual.</li><li>Cores, tipografia e elementos gráficos.</li><li>Padronização dos conteúdos digitais.</li><li>Aplicação nos materiais de divulgação e ativações.</li></ul></div><div><div class="posterSet" aria-label="Estudo ilustrativo de aplicação gráfica"><div class="poster"><small>HEALTH<br>CAMPANHA 90 DIAS</small><span>Aqui você<br>não treina<br>sozinho.</span><small class="rule">MOVIMENTO COM DIREÇÃO.</small></div><div class="poster black"><small>ESTUDO DE COMPOSIÇÃO</small><span>Seu próximo<br>passo<br>começa<br>aqui.</span><small class="rule">ESTRATÉGIA + PRESENÇA</small></div></div><p class="mockCaption">Estudo ilustrativo de aplicação. Identidade final da campanha a desenvolver.</p></div></div>`},
{slug:'anuncios',label:'Anúncios digitais',html:heading('08 / ANÚNCIOS DIGITAIS','Sua academia em destaque.<br><em>Anúncios durante 90 dias.</em>','Gestão de campanhas no Instagram e Facebook para apresentar seus diferenciais e incentivar o contato pelo WhatsApp.')+`<div class="adHighlight"><div><p class="eyebrow">INVESTIMENTO DIÁRIO EM MÍDIA</p><div class="price">R$ 10<small>/dia</small></div><p class="fine">Verba paga pelo cliente diretamente à plataforma, separada dos serviços.</p></div><div><h3>90 dias de gestão ativa.</h3><p>Acompanhamento e ajustes nas campanhas, com chamadas voltadas ao interesse, ao contato e ao agendamento de aulas experimentais.</p></div></div><div class="diagram"><div class="stages"><article><div class="step">01 / ATRAIR</div><h3>Mostrar diferenciais.</h3><p>Conteúdo e anúncios apresentam a experiência da academia.</p></article><article><div class="step">02 / CONVERSAR</div><h3>Facilitar o contato.</h3><p>O interessado chega ao WhatsApp para conhecer e agendar.</p></article><article><div class="step">03 / RECEBER</div><h3>Convidar para treinar.</h3><p>A equipe conduz o atendimento e a experiência presencial.</p></article></div></div>`},
{slug:'site',label:'Site institucional',html:`<div class="split"><div>${heading('09 / SITE INSTITUCIONAL','Uma apresentação<br>à altura da sua <em>estrutura.</em>','Desenvolvimento de um site adaptado para celular e computador, reunindo o que o futuro aluno precisa conhecer.')}<ul class="list"><li>Apresentação, estrutura e equipamentos.</li><li>Equipe, modalidades e diferenciais.</li><li>Localização e contato pelo WhatsApp.</li></ul><p class="fine">Entrega: um site institucional. Domínio e hospedagem contratados à parte.</p></div><div><div class="device"><div class="deviceScreen"><div class="deviceNav"><span>HEALTH</span><span>ESTRUTURA · EQUIPE · CONTATO</span></div><div class="deviceTitle">Aqui você<br>não treina<br>sozinho.</div><span class="miniBtn">Conheça a academia ↗</span><div class="miniGrid"><div>Estrutura</div><div>Equipe</div><div>Modalidades</div></div></div></div><p class="mockCaption">Representação ilustrativa do site incluído no escopo.</p></div></div>`},
{slug:'ativacoes',label:'Ativações e materiais',html:heading('10 / ATIVAÇÕES','Presença que vai<br><em>além do digital.</em>','Seis ações quinzenais de captação planejadas para aproximar novos alunos da academia.')+`<div class="cards">${card('10.000','Panfletos impressos','Criação da arte e impressão para apoiar a divulgação da campanha.')}${card('02','Fly banners médios','Criação da arte e produção para dar visibilidade às ativações.')}${card('01','Banner 80 × 120 cm','Arte e produção de um banner de apoio para as ações.')}</div><div class="strip"><p><strong>6 ações planejadas:</strong> objetivo, público, dinâmica, chamada e orientação de divulgação.</p></div><p class="fine">Papel, formato e acabamento dos panfletos, medidas e estrutura dos fly banners e acabamento do banner serão definidos na especificação de produção. Brindes e custos operacionais de execução das ativações não estão inclusos.</p>`},
{slug:'whatsapp',label:'Scripts de atendimento',html:`<div class="split"><div>${heading('11 / WHATSAPP','Do primeiro “olá”<br>ao convite para <em>matrícula.</em>','Uma estrutura com oito modelos de mensagens para um atendimento claro, acolhedor e alinhado à academia.')}<div class="cards two">${feature('01–04','Receber e agendar','Primeiro contato, identificação do interesse, apresentação da academia e agendamento.')}${feature('05–08','Acompanhar e convidar','Confirmação, lembrete, retorno após a aula experimental e convite para matrícula.')}</div><p class="fine">A aplicação dos scripts e o atendimento aos interessados ficam com a equipe da academia.</p></div><div class="chat"><div class="chatHead">HEALTH · EXEMPLO DE ABORDAGEM</div><div class="bubble">Olá! Que bom ter você por aqui. 😊 Você já treina ou está pensando em começar?</div><div class="bubble orange">Quero começar, mas preciso de orientação.</div><div class="bubble">Vamos conhecer seu objetivo e explicar como funciona o acompanhamento. Qual horário seria melhor para você?</div><p class="chatLabel">Exemplo ilustrativo. Os oito modelos serão desenvolvidos para a campanha.</p></div></div>`},
{slug:'cronograma',label:'A jornada dos 90 dias',html:heading('12 / CRONOGRAMA','Três etapas.<br><em>Uma direção.</em>','Uma campanha contínua, com planejamento, produção e ações de captação em cada fase.')+`<div class="diagram"><div class="stages"><article><div class="step">DIAS 01–30</div><h3>Estruturar<br>e apresentar.</h3><p>Organização dos canais, identidade da campanha, início dos conteúdos e lançamento dos anúncios.</p><span class="chip">2 ativações planejadas</span></article><article><div class="step">DIAS 31–60</div><h3>Aproximar<br>e fortalecer.</h3><p>Continuidade da produção, valorização da equipe e da rotina, ativações e ajustes de comunicação.</p><span class="chip">2 ativações planejadas</span></article><article><div class="step">DIAS 61–90</div><h3>Reforçar<br>e convidar.</h3><p>Ênfase na experiência de treinar com acompanhamento, convites para aulas experimentais e captação.</p><span class="chip">2 ativações planejadas</span></article></div></div><p class="fine">Calendário final, datas de visitas e especificações de produção alinhados no início do projeto.</p>`},
{slug:'entregas',label:'Resumo das entregas',html:heading('13 / ESCOPO COMPLETO','Tudo conectado.<br><em>Tudo em um plano.</em>','Volumes totais previstos para os 90 dias de campanha.')+`<div class="cards two" style="margin-top:0"><div>${table([['Planejamento estratégico','1'],['Identidade visual da campanha','1'],['Perfis sociais administrados','2'],['Calendários editoriais','3'],['Vídeos com roteiros','39'],['Criativos estáticos','26'],['Legendas para vídeos e criativos','65'],['Fotos tratadas','90'],['Visitas presenciais / horas','26 / 78h']])}</div><div>${table([['Publicações no Google Meu Negócio','13'],['Site institucional','1'],['Ativações planejadas','6'],['Modelos de mensagens para WhatsApp','8'],['Gestão de anúncios','90 dias'],['Panfletos impressos','10.000'],['Fly banners médios','2'],['Banner 80 × 120 cm','1']])}</div></div>`},
{slug:'investimento',label:'Investimento',html:`<div class="split"><div>${heading('14 / INVESTIMENTO','Estratégia e presença<br>para os próximos<br><em>90 dias.</em>','O escopo integra planejamento, produção, gestão, identidade visual, site e os materiais impressos especificados.')}<div class="dots" aria-hidden="true"></div><p class="note">Campanha de 90 dias · Pagamento a definir</p><details class="details"><summary>O que fica fora do investimento?</summary><p>Domínio, hospedagem, brindes e custos operacionais de execução das ativações. A verba de mídia de R$ 10 por dia é paga separadamente pelo cliente. Os 10.000 panfletos, dois fly banners médios e um banner de 80 × 120 cm estão inclusos nos serviços e materiais.</p></details></div><div class="investment"><p class="eyebrow">INVESTIMENTO TOTAL · 90 DIAS</p><div class="price">R$ 20.000</div><p class="fine">Valor total pelos 90 dias de campanha.</p><div class="moneyLine"><span>Serviços e materiais apresentados</span><strong>Inclusos</strong></div><div class="moneyLine"><span>Período completo</span><strong>90 dias</strong></div><div class="moneyLine"><span>Verba de anúncios à parte</span><strong>R$ 10/dia</strong></div><p class="fine">Condição de pagamento a definir. Sem compromisso gerado pela navegação nesta apresentação.</p></div></div>`},

const main=document.querySelector('main'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),menu=document.querySelector('#index'),shade=document.querySelector('#shade'),menuBtn=document.querySelector('#menuBtn');let current=0;
function setMenu(open){menu.hidden=!open;shade.hidden=!open;menuBtn.setAttribute('aria-expanded',String(open));if(open){menu.querySelector('[aria-current="page"]').focus()}else menuBtn.focus()}
function render(focus=false){let slug=decodeURIComponent(location.hash.replace(/^#\/?/,''));let n=pages.findIndex(p=>p.slug===slug);current=n<0?0:n;main.innerHTML=`<section class="page" aria-label="${pages[current].label}">${pages[current].html}</section>`;document.title=`${pages[current].label} — RIQ × Health | 90 dias`;prev.disabled=current===0;next.textContent=current===pages.length-1?'Voltar ao início ↺':'Próxima etapa ↗';document.querySelector('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${pages.length} · ${Math.round((current+1)/pages.length*100)}%`;document.querySelector('#bar').style.width=((current+1)/pages.length*100)+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',current+1);document.querySelector('#indexLinks').innerHTML=pages.map((p,i)=>`<a href="#/${p.slug}" ${i===current?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span>${p.label}</a>`).join('');if(focus){window.scrollTo(0,0);main.focus({preventScroll:true})}}
function go(n){n=Math.max(0,Math.min(pages.length-1,n));if(current===n){render(true)}else location.hash='/'+pages[n].slug}
prev.onclick=()=>go(current-1);next.onclick=()=>go(current===pages.length-1?0:current+1);menuBtn.onclick=()=>setMenu(menu.hidden);document.querySelector('#closeMenu').onclick=()=>setMenu(false);shade.onclick=()=>setMenu(false);
document.addEventListener('click',e=>{const btn=e.target.closest('[data-go]');if(btn)go(Number(btn.dataset.go));if(e.target.closest('#indexLinks a')){menu.hidden=true;shade.hidden=true;menuBtn.setAttribute('aria-expanded','false')}if(e.target.closest('#finish')){const s=document.querySelector('#finishStatus');s.textContent='Apresentação concluída. Obrigado por conhecer a proposta RIQ para a Health. O próximo passo é alinhar os detalhes comerciais e o início da campanha.';e.target.closest('#finish').textContent='Apresentação concluída ✓';e.target.closest('#finish').disabled=true}});
document.addEventListener('keydown',e=>{if(!menu.hidden){if(e.key==='Escape')setMenu(false);if(e.key==='Tab'){const f=menu.querySelectorAll('button,a');if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'&&current<pages.length-1){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'&&current>0){e.preventDefault();go(current-1)}});
window.addEventListener('hashchange',()=>render(true));render();
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'})});
</script></body></html>
